[project]
name = "learning-site-tools"
version = "0.0.0"
description = "Repository tooling (lab reference tests, content checks). Not a distributable package."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff", "pytest", "pyyaml", "numpy"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixtures mimic lab files (tests rely on names injected by the harness).
extend-exclude = ["scripts/__fixtures__"]
