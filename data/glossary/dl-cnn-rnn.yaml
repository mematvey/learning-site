- id: convolution
  term: свёртка
  term_en: convolution
  definition: 'Операция, которая применяет один и тот же набор весов к каждому окну соседних элементов входа. Выход в каждой позиции зависит только от окна вокруг неё.'
  chapter: dl/cnn-rnn
- id: conv-kernel
  term: ядро свёртки
  term_en: convolution kernel
  definition: 'Набор весов фиксированного размера, который проходит по входу. Одно и то же ядро используется во всех позициях.'
  chapter: dl/cnn-rnn
- id: receptive-field
  term: рецептивное поле
  term_en: receptive field
  definition: 'Множество входных элементов, которые влияют на один выход сети. Для стека свёрток растёт с глубиной и шагом между отсчётами.'
  chapter: dl/cnn-rnn
- id: equivariance
  term: эквивариантность
  term_en: equivariance
  definition: 'Свойство преобразования: если преобразовать вход, выход преобразуется предсказуемо тем же способом. Свёртка эквивариантна к сдвигу входа.'
  chapter: dl/cnn-rnn
- id: recurrent-network
  term: рекуррентная сеть
  term_en: recurrent neural network
  definition: 'Сеть, которая обрабатывает последовательность по шагам и на каждом шаге обновляет скрытое состояние, зависящее от предыдущего.'
  chapter: dl/cnn-rnn
- id: hidden-state
  term: скрытое состояние
  term_en: hidden state
  definition: 'Вектор фиксированного размера, в котором рекуррентная сеть хранит сжатую информацию о прочитанной части последовательности.'
  chapter: dl/cnn-rnn
- id: lstm
  term: LSTM
  term_en: long short-term memory
  definition: 'Рекуррентная ячейка с вентилями забывания, входа и выхода и отдельным состоянием ячейки. Вентили позволяют сохранять информацию на много шагов.'
  chapter: dl/cnn-rnn
- id: state-space-model
  term: модель в пространстве состояний
  term_en: state space model
  definition: 'Последовательная модель, которая обновляет состояние линейно по входу и обрабатывает последовательность за время, линейное по её длине. Современные варианты добавляют зависимость параметров от входа.'
  chapter: dl/cnn-rnn
