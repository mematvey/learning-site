- id: next-token-prediction
  term: предсказание следующего токена
  term_en: next-token prediction
  definition: 'Задача предобучения языковой модели: по началу текста угадать распределение следующего токена. Качество модели измеряется тем, насколько хорошо она угадывает продолжения.'
  chapter: dl/lm-training-scaling
- id: scaling-law
  term: закон масштабирования
  term_en: scaling law
  definition: 'Зависимость ошибки модели от числа параметров, объёма данных и вычислений, которая описывается степенной функцией и используется для экстраполяции с малых моделей на большие.'
  chapter: dl/lm-training-scaling
- id: compute-budget
  term: вычислительный бюджет
  term_en: compute budget
  definition: 'Общий объём вычислений, отпущенный на обучение модели, обычно в операциях с плавающей точкой (FLOP). Для трансформера примерно равен 6 N D, где N число параметров, D число токенов.'
  chapter: dl/lm-training-scaling
- id: chinchilla-optimal
  term: оптимальное по Chinchilla соотношение
  term_en: Chinchilla-optimal ratio
  definition: 'Соотношение числа параметров и токенов, при котором фиксированный бюджет вычислений даёт наименьшую потерю по оценке из статьи Chinchilla (2022). Эвристика около двадцати токенов на параметр; её константа оспаривается.'
  chapter: dl/lm-training-scaling
- id: overtraining
  term: перетренировка
  term_en: overtraining
  definition: 'Обучение модели меньшего размера на большем числе токенов, чем предписывает оптимум для бюджета обучения. Выгодно, когда расходы на инференс важнее расходов на обучение.'
  chapter: dl/lm-training-scaling
