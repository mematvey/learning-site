- id: mlops
  term: MLOps
  term_en: MLOps
  definition: 'Практики, которые переводят модель из эксперимента в эксплуатируемый сервис: повторяемое обучение, проверка, выкладка и мониторинг, с автоматизацией там, где она окупается.'
  chapter: mlops/lifecycle
- id: retraining
  term: повторное обучение
  term_en: retraining
  definition: 'Обучение модели заново на новых данных, чтобы она оставалась актуальной. Может запускаться по расписанию или по сигналу мониторинга.'
  chapter: mlops/lifecycle
- id: ml-technical-debt
  term: технический долг ML
  term_en: technical debt in ML
  definition: 'Дополнительные расходы на поддержку, которые копятся в ML-системе из-за быстрых решений: запутанных зависимостей, скрытых связей между компонентами и неучтённых потребителей выхода модели.'
  chapter: mlops/lifecycle
- id: maturity-level
  term: уровень зрелости
  term_en: maturity level
  definition: 'Ступень, которая описывает, насколько процесс разработки и выкладки моделей автоматизирован. Низкий уровень означает ручные шаги и редкие выкладки.'
  chapter: mlops/lifecycle
- id: build-vs-buy
  term: собрать или купить
  term_en: build vs buy
  definition: 'Выбор между собственной инфраструктурой и готовым сервисом. Решение зависит от отличий задачи от типовой и от того, кто будет поддерживать систему.'
  chapter: mlops/lifecycle
