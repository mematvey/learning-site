- id: expert
  term: эксперт
  term_en: expert
  definition: 'Подсеть внутри MoE-слоя, обычно MLP той же формы, что в блоке трансформера. Эксперт обрабатывает только те токены, которые ему направил маршрутизатор.'
  chapter: dl/moe
- id: top-k-routing
  term: маршрутизация top-k
  term_en: top-k routing
  definition: 'Выбор k экспертов с наибольшими оценками маршрутизатора для каждого токена; веса выбранных экспертов нормируют на их сумму.'
  chapter: dl/moe
- id: total-parameters
  term: полные параметры
  term_en: total parameters
  definition: 'Все параметры модели, включая параметры всех экспертов. Определяют объём памяти под веса.'
  chapter: dl/moe
- id: active-parameters
  term: активные параметры
  term_en: active parameters
  definition: 'Параметры, которые участвуют в вычислении одного токена: общая часть плюс выбранные эксперты. Определяют вычисления на токен.'
  chapter: dl/moe
- id: load-balancing-loss
  term: вспомогательная потеря балансировки
  term_en: load balancing loss
  definition: 'Добавка к функции потерь, которая штрафует неравномерную загрузку экспертов и поощряет равномерное распределение токенов.'
  chapter: dl/moe
- id: capacity-factor
  term: коэффициент ёмкости
  term_en: capacity factor
  definition: 'Множитель, который задаёт число токенов на эксперта сверх равномерной доли. Токены сверх этой ёмкости не обрабатываются экспертом.'
  chapter: dl/moe
