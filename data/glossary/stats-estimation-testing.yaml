- id: estimator
  term: оценка
  term_en: estimator
  definition: Функция от выборки, которая даёт число-приближение неизвестного параметра распределения.
  chapter: stats/estimation-testing
- id: confidence-interval
  term: доверительный интервал
  term_en: confidence interval
  definition: Диапазон, построенный по выборке процедурой, которая при многократном повторении опыта накрывает истинное значение параметра в заданной доле случаев.
  chapter: stats/estimation-testing
- id: t-distribution
  term: t-распределение
  term_en: Student's t-distribution
  definition: 'Распределение статистики (x̄ − μ)/(s/√n) при нормальных данных и неизвестной дисперсии, где s выборочное стандартное отклонение. Хвосты тяжелее, чем у нормального, и форма зависит от числа степеней свободы n − 1.'
  chapter: stats/estimation-testing
- id: degrees-of-freedom
  term: степени свободы
  term_en: degrees of freedom
  definition: 'Число значений, которые могут меняться независимо после того, как по выборке посчитаны нужные величины. Для t-распределения с выборочным средним и стандартным отклонением по n измерениям равно n − 1.'
  chapter: stats/estimation-testing
- id: confidence-level
  term: уровень доверия
  term_en: confidence level
  definition: 'Доля повторений опыта, в которых процедура построения интервала накрывает истинное значение параметра. Равен 1 − α, например 95%.'
  chapter: stats/estimation-testing
- id: unbiased-estimator
  term: несмещённая оценка
  term_en: unbiased estimator
  definition: Оценка, ожидание которой равно оцениваемому параметру. Выборочное среднее несмещённо для μ; выборочная дисперсия несмещённа при делении на n − 1.
  chapter: stats/estimation-testing
- id: consistency
  term: состоятельность оценки
  term_en: consistency
  definition: Свойство оценки сходиться к параметру при росте объёма выборки. Выборочное среднее состоятельно, потому что его дисперсия σ²/n стремится к нулю.
  chapter: stats/estimation-testing
