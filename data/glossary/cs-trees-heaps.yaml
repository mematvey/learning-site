- id: tree-node
  term: узел дерева
  term_en: tree node
  definition: Элемент дерева, который хранит ключ (или значение) и ссылки на потомков. В бинарном дереве у узла до двух потомков.
  chapter: cs/trees-heaps
- id: tree-bst
  term: бинарное дерево поиска
  term_en: binary search tree (BST)
  definition: Бинарное дерево, в котором у каждого узла левое поддерево содержит меньшие ключи, а правое большие. Поиск и вставка идут по одному пути от корня, и их время определяется высотой дерева.
  chapter: cs/trees-heaps
- id: tree-height
  term: высота дерева
  term_en: tree height
  definition: Число рёбер на самом длинном пути от корня до листа. Для дерева из одного узла высота ноль.
  chapter: cs/trees-heaps
- id: tree-balance
  term: балансировка
  term_en: balancing
  definition: Перестройка дерева при вставках и удалениях, которая удерживает высоту на уровне логарифма от числа ключей. Примеры AVL-деревья, красно-чёрные деревья и B-деревья.
  chapter: cs/trees-heaps
- id: tree-btree
  term: B-дерево
  term_en: B-tree
  definition: Сбалансированное дерево поиска, у которого каждый узел содержит много ключей и потомков. Узел обычно соответствует странице памяти или диска, поэтому дерево низкое. Предложено в 1972 году для индексов на внешней памяти.
  chapter: cs/trees-heaps
- id: tree-heap-property
  term: свойство кучи
  term_en: heap property
  definition: Условие, по которому в min-heap каждый родитель не больше своих потомков. Наименьший элемент всегда находится в корне. Порядок между соседними ветвями не задан.
  chapter: cs/trees-heaps
- id: tree-priority-queue
  term: приоритетная очередь
  term_en: priority queue
  definition: Структура, которая выдаёт элемент с наибольшим (или наименьшим) приоритетом, а не с самым ранним временем добавления. Обычно реализуется кучей.
  chapter: cs/trees-heaps
- id: tree-heapify
  term: построение кучи
  term_en: heapify
  definition: Преобразование готового списка в кучу на месте. Выполняется за время порядка n, а не n log n, потому что большинство узлов находятся близко к листьям.
  chapter: cs/trees-heaps
- id: tree-topk
  term: top-k
  term_en: top-k
  definition: Задача найти k наибольших (или наименьших) элементов набора. Решается min-heap из k элементов за время порядка n log k.
  chapter: cs/trees-heaps
