- id: agent-loop
  term: цикл агента
  term_en: agent loop
  definition: 'Повторяющийся процесс «модель выбирает действие, инструмент его выполняет, результат возвращается в контекст», который идёт, пока модель не даст ответ или система не остановит его.'
  chapter: mlops/agents-runtime
- id: tool-call
  term: вызов инструмента
  term_en: tool call
  definition: 'Структурированный запрос модели на выполнение внешней функции с именем и аргументами. Сама модель ничего не выполняет: код приложения выполняет вызов и возвращает результат.'
  chapter: mlops/agents-runtime
- id: tool-schema
  term: схема инструмента
  term_en: tool schema
  definition: 'Описание инструмента для модели: имя, назначение и типы аргументов. По нему модель решает, когда и с какими аргументами вызвать инструмент.'
  chapter: mlops/agents-runtime
- id: tool-result
  term: результат инструмента
  term_en: tool result
  definition: 'Ответ инструмента, который приложение добавляет в контекст модели. Модель видит его как наблюдение и выбирает следующий шаг с его учётом.'
  chapter: mlops/agents-runtime
- id: agent-state
  term: состояние агента
  term_en: agent state
  definition: 'Всё, что нужно агенту, чтобы продолжить работу после шага: история сообщений, результаты инструментов, счётчики и промежуточные данные вне контекста модели.'
  chapter: mlops/agents-runtime
- id: agent-budget
  term: бюджет агента
  term_en: agent budget
  definition: 'Ограничения одного запуска агента: число шагов, число токенов, время и деньги. Цикл останавливается, когда хотя бы один лимит исчерпан.'
  chapter: mlops/agents-runtime
- id: step-limit
  term: лимит шагов
  term_en: step limit
  definition: 'Максимальное число итераций цикла агента. Без него цикл может повторять одно и то же действие бесконечно.'
  chapter: mlops/agents-runtime
- id: idempotency
  term: идемпотентность
  term_en: idempotency
  definition: 'Свойство операции, при котором повторный вызов с тем же ключом даёт тот же результат и не выполняет действие второй раз. Нужна для инструментов с побочным эффектом, например оплаты или отправки письма.'
  chapter: mlops/agents-runtime
- id: idempotency-key
  term: ключ идемпотентности
  term_en: idempotency key
  definition: 'Уникальный идентификатор одной логической операции, который передаётся вместе с вызовом. Сервер запоминает ключ и при повторе возвращает результат первого выполнения.'
  chapter: mlops/agents-runtime
- id: human-in-the-loop
  term: человек в контуре
  term_en: human-in-the-loop
  definition: 'Схема, в которой агент перед определённым действием ставит паузу и ждёт подтверждения человека. Обычно применяется к необратимым или дорогим действиям.'
  chapter: mlops/agents-runtime
- id: checkpoint
  term: контрольная точка
  term_en: checkpoint
  definition: 'Сохранённое состояние агента после шага. После сбоя выполнение продолжается с последней точки, а не с начала.'
  chapter: mlops/agents-runtime
- id: retry
  term: повтор
  term_en: retry
  definition: 'Повторный вызов операции после сбоя. Безопасен только для идемпотентных операций или при наличии ключа идемпотентности.'
  chapter: mlops/agents-runtime
- id: mcp
  term: Model Context Protocol
  term_en: Model Context Protocol (MCP)
  definition: 'Открытый протокол, по которому клиент приложения получает от сервера список инструментов и ресурсов и вызывает их. Описан в спецификации с указанием версии.'
  chapter: mlops/agents-runtime
