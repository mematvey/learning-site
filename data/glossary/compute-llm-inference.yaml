- id: prefill
  term: префилл
  term_en: prefill
  definition: 'Первый этап инференса, когда все токены промпта обрабатываются одним проходом и заполняют KV-кэш. Обычно ограничен вычислениями.'
  chapter: compute/llm-inference
- id: decode
  term: декодирование
  term_en: decode
  definition: 'Этап генерации, когда модель выдаёт по одному токену за шаг и на каждом шаге читает веса и KV-кэш из памяти. Обычно ограничен пропускной способностью памяти.'
  chapter: compute/llm-inference
- id: memory-bandwidth
  term: пропускная способность памяти
  term_en: memory bandwidth
  definition: 'Сколько байт в секунду ускоритель может прочитать из своей памяти, например HBM. Задаёт верхний предел скорости, когда задача читает больше данных, чем делает операций.'
  chapter: compute/llm-inference
- id: kv-cache-size
  term: размер KV-кэша
  term_en: KV cache size
  definition: 'Объём памяти, который занимают ключи и значения всех токенов контекста во всех слоях. Растёт линейно от длины контекста, числа запросов в батче и числа слоёв.'
  chapter: compute/llm-inference
- id: paged-attention
  term: PagedAttention
  term_en: PagedAttention
  definition: 'Способ хранить KV-кэш блоками фиксированного размера, а не одним непрерывным куском на запрос. Уменьшает фрагментацию и дублирование памяти в сервере инференса.'
  chapter: compute/llm-inference
