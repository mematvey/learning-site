- id: maximum-likelihood
  term: максимальное правдоподобие
  term_en: maximum likelihood
  definition: 'Метод оценки параметра: выбирается значение, при котором наблюдённая выборка наиболее вероятна. Результат называют оценкой максимального правдоподобия.'
  chapter: stats/mle-fisher
- id: log-likelihood
  term: логарифм правдоподобия
  term_en: log-likelihood
  definition: 'Логарифм функции правдоподобия. Для независимых наблюдений это сумма логарифмов плотностей, поэтому её проще дифференцировать и вычислять.'
  chapter: stats/mle-fisher
- id: score-function
  term: функция состояния
  term_en: score
  definition: 'Производная логарифма правдоподобия по параметру. Её математическое ожидание равно нулю; её дисперсия равна информации Фишера.'
  chapter: stats/mle-fisher
- id: fisher-information
  term: информация Фишера
  term_en: Fisher information
  definition: 'Мера того, сколько данные сообщают о параметре: дисперсия функции состояния, равная минус математическому ожиданию второй производной логарифма плотности. Для выборки из n наблюдений информация равна n умножить на информацию одного наблюдения.'
  chapter: stats/mle-fisher
- id: cramer-rao-bound
  term: нижняя граница Крамера–Рао
  term_en: Cramér–Rao bound
  definition: 'Ограничение снизу на дисперсию любой несмещённой оценки параметра: не меньше единицы, делённой на информацию Фишера по всей выборке.'
  chapter: stats/mle-fisher
- id: asymptotic-normality
  term: асимптотическая нормальность
  term_en: asymptotic normality
  definition: 'Свойство оценки приближаться к нормальному распределению при росте объёма выборки. Для оценки максимального правдоподобия дисперсия предельного распределения равна обратной информации Фишера.'
  chapter: stats/mle-fisher
