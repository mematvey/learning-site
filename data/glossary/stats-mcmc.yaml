- id: markov-chain
  term: цепь Маркова
  term_en: Markov chain
  definition: 'Последовательность состояний, в которой следующее состояние зависит только от текущего и не зависит от предыстории. Задаётся матрицей переходов.'
  chapter: stats/mcmc
- id: stationary-distribution
  term: стационарное распределение
  term_en: stationary distribution
  definition: 'Распределение состояний, которое не меняется после применения переходов: если цепь начинается с него, она остаётся с ним же на каждом шаге.'
  chapter: stats/mcmc
- id: detailed-balance
  term: детальный баланс
  term_en: detailed balance
  definition: 'Условие, при котором поток вероятности из состояния i в состояние j равен потоку обратно. Из детального баланса следует стационарность распределения.'
  chapter: stats/mcmc
- id: proposal-distribution
  term: распределение предложения
  term_en: proposal distribution
  definition: 'Распределение, из которого цепь берёт кандидата на следующий шаг. В методе Метрополиса–Гастингса кандидат принимается не всегда.'
  chapter: stats/mcmc
- id: metropolis-hastings
  term: алгоритм Метрополиса–Гастингса
  term_en: Metropolis–Hastings algorithm
  definition: 'Способ построить цепь, стационарное распределение которой равно целевому, если целевое известно с точностью до константы. Кандидат принимается с вероятностью min(1, отношение плотностей с поправкой на предложение).'
  chapter: stats/mcmc
- id: acceptance-rate
  term: доля принятых предложений
  term_en: acceptance rate
  definition: 'Доля шагов, на которых кандидат принят. Слишком высокая доля обычно означает маленькие шаги и медленное перемещение; слишком низкая означает, что цепь почти стоит на месте.'
  chapter: stats/mcmc
- id: mcmc
  term: марковская цепь Монте-Карло
  term_en: Markov chain Monte Carlo (MCMC)
  definition: 'Семейство методов выборки из распределения через цепь Маркова: средние по цепи оценивают средние по распределению, а сама цепь строится так, чтобы её стационарным распределением было нужное.'
  chapter: stats/mcmc
- id: burn-in
  term: прогрев цепи
  term_en: burn-in
  definition: 'Начальная часть цепи, которую отбрасывают, потому что она ещё зависит от стартовой точки и не отражает стационарное распределение.'
  chapter: stats/mcmc
- id: effective-sample-size
  term: эффективный размер выборки
  term_en: effective sample size
  definition: 'Число независимых выборок, которое дала бы цепь с той же точностью оценки. Соседние значения цепи коррелированы, поэтому эффективный размер меньше числа шагов.'
  chapter: stats/mcmc
- id: r-hat
  term: R-hat
  term_en: R-hat (potential scale reduction factor)
  definition: 'Отношение оценки дисперсии, объединяющей несколько цепей, к внутрицепочечной дисперсии. Значения близкие к единице говорят о согласии цепей; заметно большие значения означают, что цепи ещё не сошлись.'
  chapter: stats/mcmc
- id: trace-plot
  term: след цепи
  term_en: trace plot
  definition: 'График значений параметра по номеру шага. По нему видно прогрев, застревание в одной моде и медленное перемешивание.'
  chapter: stats/mcmc
