- id: kv-block
  term: блок KV-кэша
  term_en: KV block
  definition: 'Участок памяти фиксированного размера, в котором хранятся ключи и значения для заданного числа токенов. Блоки выделяются по одному по мере роста последовательности.'
  chapter: compute/kv-cache-paging
- id: block-table
  term: таблица блоков
  term_en: block table
  definition: 'Список блоков одного запроса по порядку токенов: какой блок хранит первые B токенов, какой следующие B и так далее. По таблице ядро внимания находит нужные ключи и значения.'
  chapter: compute/kv-cache-paging
- id: kv-fragmentation
  term: фрагментация KV-кэша
  term_en: KV cache fragmentation
  definition: 'Память, выделенная под KV-кэш, но не занятая токенами: пустой хвост последнего блока или весь непокрытый резерв под максимальную длину. Блочная схема оставляет только первый вид потерь.'
  chapter: compute/kv-cache-paging
- id: prefix-sharing
  term: разделение общего префикса
  term_en: prefix sharing
  definition: 'Несколько запросов с одинаковым началом в токенах используют одни и те же блоки KV-кэша. Общий префикс хранится один раз, а не в каждом запросе.'
  chapter: compute/kv-cache-paging
- id: kv-eviction
  term: вытеснение запроса
  term_en: eviction
  definition: 'Временное освобождение блоков KV-кэша одного запроса, когда свободных блоков не осталось. Позже его кэш восстанавливают повторным префиллом или возвращают из памяти хоста.'
  chapter: compute/kv-cache-paging
