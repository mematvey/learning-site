- id: sample-size
  term: размер выборки
  term_en: sample size
  definition: Число наблюдений, которое нужно собрать, чтобы заданный эффект был обнаружен с заданной мощностью при заданном уровне значимости.
  chapter: stats/ab-testing
- id: effect-size
  term: размер эффекта
  term_en: effect size
  definition: Величина различия между группами или состояниями, выраженная в понятных единицах (разница средних, разница долей) или в единицах стандартного отклонения.
  chapter: stats/ab-testing
- id: minimum-detectable-effect
  term: минимальный значимый эффект
  term_en: minimum detectable effect
  definition: Наименьшая разница, которую тест должен заметить с заданной мощностью. Её выбирают до запуска эксперимента, исходя из того, что изменение должно стоить внедрения.
  chapter: stats/ab-testing
- id: peeking
  term: подглядывание
  term_en: peeking
  definition: Многократная проверка результата эксперимента до окончания запланированного срока с остановкой при первом «значимом» p-значении. Завышает долю ложных срабатываний.
  chapter: stats/ab-testing
- id: multiple-comparisons
  term: множественные сравнения
  term_en: multiple comparisons
  definition: Ситуация, когда проверяют много гипотез одновременно (метрики, варианты, сегменты). Вероятность хотя бы одного ложного срабатывания растёт с их числом.
  chapter: stats/ab-testing
- id: bonferroni-correction
  term: поправка Бонферрони
  term_en: Bonferroni correction
  definition: Поправка, при которой каждую из m проверок выполняют на уровне α/m. Общая вероятность хотя бы одной ложной находки не превышает α.
  chapter: stats/ab-testing
- id: holm-correction
  term: поправка Холма
  term_en: Holm correction
  definition: Пошаговая поправка на множественные сравнения. p-значения сортируют по возрастанию и сравнивают с порогами α/m, α/(m−1) и так далее. Контролирует ту же вероятность ошибки, что и Бонферрони, но мощнее его.
  chapter: stats/ab-testing
- id: sequential-testing
  term: последовательный тест
  term_en: sequential test
  definition: Схема проверки, в которой результат смотрят несколько раз по ходу сбора данных, а пороги заранее рассчитаны так, чтобы общая вероятность ложного срабатывания оставалась в заданных пределах.
  chapter: stats/ab-testing
