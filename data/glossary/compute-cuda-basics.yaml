- id: cuda-global-index
  term: глобальный индекс
  term_en: global index
  definition: 'Номер элемента данных, который обрабатывает поток. Считается как номер блока умножить на размер блока плюс номер потока внутри блока.'
  chapter: compute/cuda-basics
- id: cuda-bounds-check
  term: граничная проверка
  term_en: bounds check
  definition: 'Условие в начале ядра, по которому поток работает только с существующими элементами, например если индекс меньше размера массива. Нужна, когда число потоков больше числа элементов.'
  chapter: compute/cuda-basics
- id: cuda-host-device
  term: host и device
  term_en: host, device
  definition: 'Host это CPU и его память, device это GPU и его память. Ядро вызывает host, а выполняется оно на device, поэтому данные нужно перенести в память device.'
  chapter: compute/cuda-basics
