- id: lethal-trifecta
  term: смертельная тройка
  term_en: lethal trifecta
  definition: Сочетание в одной системе агента трёх свойств - доступ к приватным данным, обработка недоверенного ввода и внешний канал отправки. Вместе они позволяют вредной инструкции из текста вынести данные наружу.
  chapter: mlops/agent-guardrails
- id: tool-allowlist
  term: список разрешённых инструментов
  term_en: tool allowlist
  definition: Перечень инструментов и операций, которые агенту разрешено вызывать. Всё, чего нет в списке, отклоняет код, а не промпт.
  chapter: mlops/agent-guardrails
- id: data-exfiltration
  term: утечка данных наружу
  term_en: data exfiltration
  definition: Передача приватных данных за пределы системы через любой канал, включая отправку письма и запрос к внешнему адресу с данными в параметрах.
  chapter: mlops/agent-guardrails
