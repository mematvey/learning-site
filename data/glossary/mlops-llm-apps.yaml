- id: prompt
  term: промпт
  term_en: prompt
  definition: Входной текст, который задаёт модели инструкцию, контекст и формат ответа. Один вызов модели с промптом не меняет её веса и не добавляет знаний, кроме тех, что уже в самом тексте.
  chapter: mlops/llm-apps
- id: prompt-version
  term: версия промпта
  term_en: prompt version
  definition: Однозначный идентификатор текста промпта, например хэш содержимого или номер коммита, который записывается в каждую трассу вызова вместе с версией модели.
  chapter: mlops/llm-apps
- id: embedding
  term: эмбеддинг
  term_en: embedding
  definition: Вектор фиксированной длины, которым представлен текст или фрагмент. Близкие по смыслу тексты дают близкие векторы; поиск ищет ближайшие к запросу векторы.
  chapter: mlops/llm-apps
- id: rag
  term: RAG
  term_en: retrieval-augmented generation
  definition: Схема, в которой модель получает во входе фрагменты, найденные во внешнем индексе по запросу, и опирается на них при генерации ответа.
  chapter: mlops/llm-apps
- id: chunk
  term: фрагмент
  term_en: chunk
  definition: Часть документа фиксированного или логического размера, на которые режут текст для индексации и поиска. Поиск возвращает фрагменты, а не документы целиком.
  chapter: mlops/llm-apps
- id: recall-at-k
  term: полнота при k
  term_en: recall@k
  definition: Доля релевантных фрагментов, попавших в первые k результатов поиска, от всех релевантных. Считается по размеченным запросам.
  chapter: mlops/llm-apps
- id: golden-set
  term: эталонный набор
  term_en: golden set
  definition: Фиксированный набор пар «вход и ожидаемый результат» или критерий проверки, на котором сравниваются версии промпта, индекса или модели. Набор не меняют, когда меняется система.
  chapter: mlops/llm-apps
- id: regression-test
  term: регрессионный тест
  term_en: regression test
  definition: Проверка, которая запускается при каждом изменении и сравнивает качество с порогом на эталонном наборе. Тест ловит ухудшение на тех примерах, которые раньше работали.
  chapter: mlops/llm-apps
- id: workflow
  term: workflow
  term_en: workflow
  definition: Система, где порядок шагов задан кодом заранее, а модель вызывается в отдельных шагах. Модель не выбирает следующий шаг сама.
  chapter: mlops/llm-apps
- id: agent
  term: агент
  term_en: agent
  definition: Система, в которой модель сама решает, какой инструмент вызвать и когда остановиться, на основе промежуточных результатов. Порядок действий не задан заранее.
  chapter: mlops/llm-apps
