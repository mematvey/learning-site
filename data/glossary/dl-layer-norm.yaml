- id: residual-connection
  term: остаточная связь
  term_en: residual connection
  definition: Связь, которая прибавляет вход слоя к его выходу; если выход слоя близок к нулю, вход проходит почти без изменений.
  chapter: dl/layer-norm
- id: layer-norm
  term: LayerNorm
  term_en: layer normalization
  definition: Нормализация вектора одного токена по его признакам; среднее и дисперсия считаются по признакам, а не по батчу; затем есть обучаемые масштаб и сдвиг.
  chapter: dl/layer-norm
- id: batch-norm
  term: BatchNorm
  term_en: batch normalization
  definition: Нормализация, которая считает среднее и дисперсию по батчу отдельно для каждого признака; зависит от размера батча.
  chapter: dl/layer-norm
- id: rms-norm
  term: RMSNorm
  term_en: root mean square normalization
  definition: Упрощённый LayerNorm без вычитания среднего; вектор делится на корень из среднего квадратов признаков и умножается на обучаемый масштаб.
  chapter: dl/layer-norm
- id: pre-ln
  term: Pre-LN
  definition: Расположение нормализации внутри ветки слоя, перед слоем; сумма входа с результатом идёт без нормализации, и путь от входа к выходу её не проходит.
  chapter: dl/layer-norm
- id: post-ln
  term: Post-LN
  definition: Расположение нормализации после суммы входа и результата слоя, как в исходном трансформере.
  chapter: dl/layer-norm
- id: batch
  term: батч
  term_en: batch
  definition: Группа примеров, которую сеть обрабатывает за один шаг. BatchNorm считает статистику по батчу, а LayerNorm не зависит от него.
  chapter: dl/layer-norm
