- id: glm
  term: обобщённая линейная модель
  term_en: generalized linear model
  definition: 'Модель, в которой отклик распределён в экспоненциальном семействе, а его среднее связано с линейной комбинацией признаков через связующую функцию. Линейная и логистическая регрессии — её частные случаи.'
  chapter: stats/glm
- id: link-function
  term: связующая функция
  term_en: link function
  definition: 'Функция g, которая связывает среднее отклика μ с линейным предиктором: g(μ) = η. Выбирает допустимую область значений среднего, например положительные числа для счётчика или отрезок от нуля до единицы для вероятности.'
  chapter: stats/glm
- id: linear-predictor
  term: линейный предиктор
  term_en: linear predictor
  definition: 'Линейная комбинация признаков η = x·β с коэффициентами β. В GLM она линейна по параметрам, а связь со средним идёт через связующую функцию.'
  chapter: stats/glm
- id: exponential-family
  term: экспоненциальное семейство
  term_en: exponential family
  definition: 'Класс распределений вида exp{(yθ − b(θ))/a(φ) + c(y, φ)}. Среднее равно b′(θ), дисперсия равна a(φ)·b″(θ). Нормальное, Пуассона, Бернулли и гамма-распределения входят в него.'
  chapter: stats/glm
  layer: { c: 3, d: 1 }
- id: canonical-link
  term: каноническая связующая функция
  term_en: canonical link
  definition: 'Связующая функция, при которой параметр θ экспоненциального семейства равен линейному предиктору η. Для Пуассона это логарифм, для распределения Бернулли это логит.'
  chapter: stats/glm
  layer: { c: 3, d: 1 }
- id: poisson-regression
  term: пуассоновская регрессия
  term_en: Poisson regression
  definition: 'GLM с пуассоновским откликом и логарифмической связующей функцией. Коэффициент показывает, во сколько раз умножается среднее счётчика при росте признака на единицу.'
  chapter: stats/glm
- id: logistic-glm
  term: логистическая регрессия как GLM
  term_en: logistic regression
  definition: 'GLM с распределением Бернулли и логит-связью: log(p/(1 − p)) = η. Коэффициент показывает, во сколько раз умножается шанс (отношение p/(1 − p)) при росте признака на единицу.'
  chapter: stats/glm
- id: overdispersion
  term: переразброс
  term_en: overdispersion
  definition: 'Дисперсия отклика больше той, которую предписывает модель. Для пуассоновской модели это значит, что выборочная дисперсия счётчика заметно больше среднего. Стандартные ошибки тогда занижены.'
  chapter: stats/glm
- id: negative-binomial
  term: отрицательное биномиальное распределение
  term_en: negative binomial distribution
  definition: 'Распределение счётчика с дисперсией μ + μ²/k. Дополнительный параметр k поглощает переразброс; при росте k распределение приближается к пуассоновскому.'
  chapter: stats/glm
- id: irls
  term: итеративно взвешенный метод наименьших квадратов
  term_en: iteratively reweighted least squares
  definition: 'Алгоритм оценки GLM. На каждом шаге решается взвешенная задача наименьших квадратов с пересчитанными весами и откликом, пока оценки не перестанут меняться.'
  chapter: stats/glm
- id: pearson-dispersion
  term: статистика Пирсона для дисперсии
  term_en: Pearson dispersion statistic
  definition: 'Сумма квадратов остатков Пирсона, делённая на число степеней свободы. Близка к единице, если выбранная дисперсия модели согласуется с данными.'
  chapter: stats/glm
