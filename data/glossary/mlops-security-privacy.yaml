- id: pii
  term: персональные данные
  term_en: personally identifiable information (PII)
  definition: 'Данные, по которым можно узнать человека: имя, телефон, адрес электронной почты, идентификаторы. Требуют особого обращения по закону и по политике организации.'
  chapter: mlops/security-privacy
- id: data-minimization
  term: минимизация данных
  term_en: data minimization
  definition: 'Передача и хранение только тех данных, которые нужны для задачи, и только на нужный срок.'
  chapter: mlops/security-privacy
- id: unsafe-deserialization
  term: небезопасная десериализация
  term_en: unsafe deserialization
  definition: 'Загрузка данных из формата, который при чтении может выполнить код. Для моделей типичный пример формат pickle.'
  chapter: mlops/security-privacy
