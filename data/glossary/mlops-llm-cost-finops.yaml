- id: cost-per-success
  term: цена за успешную задачу
  term_en: cost per successful task
  definition: 'Вся сумма, потраченная на задачу, включая неудачные попытки и повторы, поделённая на число задач, выполненных успешно. Показывает стоимость результата, а не одного вызова.'
  chapter: mlops/llm-cost-finops
- id: model-routing
  term: маршрутизация моделей
  term_en: model routing
  definition: 'Направление каждой задачи в одну из нескольких моделей по простому признаку, например по сложности или типу запроса, чтобы дешёвая модель обрабатывала задачи, с которыми справляется.'
  chapter: mlops/llm-cost-finops
- id: prefix-cache
  term: кэш префикса
  term_en: prefix caching
  definition: 'Повторное использование уже обработанного начала промпта, например системной инструкции. Попадание возможно только при точном совпадении начала, поэтому постоянные части промпта ставят в начало.'
  chapter: mlops/llm-cost-finops
