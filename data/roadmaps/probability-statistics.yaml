id: probability-statistics
title: 'Вероятность и статистика'
summary: 'Весь раздел «Статистика» по порядку: от классической вероятности до оценок, бутстрэпа, байесовского вывода, регрессии и причинности.'
audience: 'Для тех, кому нужна база по теории вероятностей перед машинным обучением и анализом данных.'
goal: 'Считать вероятности, работать с распределениями и понимать, что говорят оценки, тесты и эксперименты.'
steps:
  - title: 'Классическая вероятность'
    description: 'Пространство исходов, комбинаторика, условная вероятность и формула Байеса.'
    chapters: [stats/classical-probability, stats/classical-probability-2]
  - title: 'Случайные величины'
    description: 'Математическое ожидание, дисперсия и их свойства.'
    chapters: [stats/random-variables]
  - title: 'Распределения'
    description: 'Основные дискретные и непрерывные распределения и где они встречаются.'
    chapters: [stats/distributions]
    labs: [stats-distributions]
  - title: 'Предельные теоремы'
    description: 'Закон больших чисел и центральная предельная теорема.'
    chapters: [stats/limit-theorems]
    labs: [stats-limit-theorems]
  - title: 'Оценивание параметров'
    description: 'Точечные оценки, их свойства и доверительные интервалы.'
    chapters: [stats/estimation-testing]
    labs: [stats-estimation-testing]
  - title: 'Проверка гипотез'
    description: 'P-значение, ошибки первого и второго рода, t-критерий Уэлча и мощность критерия.'
    chapters: [stats/hypothesis-testing]
  - title: 'Максимальное правдоподобие и бутстрэп'
    description: 'Оценка по правдоподобию, информация Фишера, интервалы через пересэмплирование и перестановочные тесты.'
    chapters: [stats/mle-fisher, stats/bootstrap-permutation]
    labs: [stats-mle-fisher, stats-bootstrap-permutation]
  - title: 'Байесовский вывод'
    description: 'Апостериорное распределение вместо p-value: как обновлять веру данными.'
    chapters: [stats/bayesian-inference]
    labs: [stats-bayesian-inference]
  - title: 'Регрессия'
    description: 'Регрессия как статистический метод: допущения, остатки и интервалы.'
    chapters: [stats/regression]
    labs: [stats-regression]
  - title: 'A/B-тесты'
    description: 'Размер выборки, мощность и честная остановка эксперимента.'
    chapters: [stats/ab-testing]
    labs: [stats-ab-testing]
  - title: 'Причинность'
    description: 'Конфаундеры, DAG и контроль: когда корреляция не отвечает на вопрос о причине.'
    chapters: [stats/causal-inference]
